<div class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100">

  >
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center gap-3">
      <div
        class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-md"
      >
        <ng-icon name="heroCube" color="white" size="20" />
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-800 leading-tight">Product Catalog</h1>
        <p class="text-xs text-slate-400 leading-tight">Manage your products</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-10">

      <app-product-form></app-product-form>
